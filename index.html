<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>史嘉欣 · 一面作品墙</title>
<meta name="description" content="史嘉欣 Jiaxin Shi — UI / 交互 / 产品设计，一面收藏作品与灵感的墙。">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="wall.css">
</head>
<body>
<main class="wall" id="top" aria-label="史嘉欣的作品墙">
  <div class="room" id="room">
    <header class="wall-heading">
      <a class="brand" href="#top">史嘉欣 <span>Jiaxin Shi</span></a>
      <p class="eyebrow">A SMALL LIBRARY OF THINGS I MAKE</p>
      <h1>设计，也收藏<br>一点<span>好奇心。</span></h1>
      <p class="intro">UI / 交互 / 产品设计<br>欢迎来到我的一面作品墙。</p>
      <span class="edition">SELECTED WORKS · 2022—2026</span>
    </header>

    <section class="wall-notes" aria-label="墙上的其他作品">
      <button class="wall-photo photo-one" data-project="4" aria-label="查看动画工作室项目">
        <span class="tape" aria-hidden="true"></span>
        <img src="assets/animation-studio.png" alt="动画工作室项目作品" draggable="false">
        <span class="photo-caption">动画工作室 <small>2021—23 ↗</small></span>
      </button>
      <button class="wall-photo photo-two" id="drawing-note" aria-label="查看绘画收藏">
        <span class="tape" aria-hidden="true"></span>
        <span class="drawing-art" aria-hidden="true"><span class="sketch-circle"></span><span class="sketch-vase"></span><i>little things,<br>close observations.</i></span>
        <span class="photo-caption">绘画收藏 <small>COMING SOON</small></span>
      </button>
      <button class="motion-note" id="motion-note" aria-label="查看小动画收藏">
        <span class="pin" aria-hidden="true"></span>
        <span class="note-index">FIELD NOTES / 03</span>
        <strong>让想法<br>动起来。</strong>
        <span class="note-bottom">小动画 / 整理中 <b>↗</b></span>
      </button>
    </section>

    <section class="home-shelf" id="shelf-projects" aria-label="主项目单层书架">
      <div class="shelf-label"><span>01 — SELECTED PROJECTS</span><span>我的项目书架</span></div>
      <div class="stage-wrap" id="stageWrap">
        <div class="stage" id="stage" tabindex="0" aria-label="使用左右方向键切换项目">
          <div class="shelf-line"></div>
          <div class="row" id="row"></div>
        </div>
      </div>
      <div class="shelf-controls">
        <p class="hint" id="hint">点书脊翻阅 · 再点封面打开项目</p>
        <div class="shelf-ui">
          <button class="arrow" id="prev" aria-label="上一本">←</button>
          <div class="dots" id="dots"></div>
          <button class="arrow" id="next" aria-label="下一本">→</button>
        </div>
      </div>
    </section>

    <button class="library-card" id="about-note" aria-label="查看关于我与联系方式">
      <span class="tape" aria-hidden="true"></span>
      <span class="note-index">LIBRARY CARD / 关于我</span>
      <strong>你好，我是嘉欣。</strong>
      <span>格拉斯哥艺术学院 · GSA<br>在研究、图像和交互之间探索。</span>
      <span class="card-link">认识我 / GET IN TOUCH ↗</span>
    </button>
    <footer class="wall-footer"><span>© 2026 史嘉欣</span><span>一些作品，一点生活。<i class="footer-dot"></i></span></footer>
  </div>
</main>
<div class="reader" id="reader" hidden>
  <div class="reader-bg" data-close></div>
  <article class="book" role="dialog" aria-modal="true">
    <button class="close" data-close aria-label="关闭">×</button>
    <div class="book-cover"><img id="r-img" alt=""></div>
    <div class="book-body">
      <p class="tag" id="r-meta"></p>
      <h3 id="r-title"></h3>
      <p class="sub" id="r-sub"></p>
      <div class="chips" id="r-chips"></div>
      <div id="r-text"></div>
    </div>
  </article>
</div>

<script src="script.js"></script>
</body>
</html>
